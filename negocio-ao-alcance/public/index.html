    <title>Negócio ao Alcance</title>

    <style>
      /* ✨ SPLASH SCREEN */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0a1530 0%, #0d1b3e 50%, #0a1530 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        text-align: center;
        animation: splashFadeIn 0.6s ease-out;
      }

      @keyframes splashFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes splashFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(5deg); }
      }

      @keyframes splashPulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      .splash-icon {
        font-size: 5rem;
        animation: splashFloat 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 30px rgba(74, 140, 247, 0.6));
      }

      .splash-title {
        font-size: 1.6rem;
        font-weight: 900;
        margin: 24px 0 8px;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 0%, #d0e0ff 40%, #7eb8ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .splash-subtitle {
        color: #8899aa;
        font-size: 0.9rem;
        margin: 0 0 24px;
        letter-spacing: 0.5px;
      }

      .splash-loader {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .splash-dot {
        width: 8px;
        height: 8px;
        background: #4a8cf7;
        border-radius: 50%;
        animation: splashPulse 1.4s ease-in-out infinite;
      }

      .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este app.</noscript>

    <!-- ✨ SPLASH SCREEN -->
    <div id="splash-screen">
      <div class="splash-content">
        <div class="splash-icon">🚀</div>
        <h1 class="splash-title">Negócio ao Alcance</h1>
        <p class="splash-subtitle">Carregando...</p>
        <div class="splash-loader">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
  </body>
</html>
